version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: videnti_db
    restart: always
    network_mode: host
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  auth-service:
    build: .
    image: videnti-app:latest
    command: ./auth
    container_name: videnti_auth
    restart: always
    network_mode: host
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  attendance-service:
    image: videnti-app:latest
    command: ./attendance
    container_name: videnti_attendance
    restart: always
    network_mode: host
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  payroll-service:
    image: videnti-app:latest
    command: ./payroll
    container_name: videnti_payroll
    restart: always
    network_mode: host
    depends_on:
      - postgres
    volumes:
      - uploads_data:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  gateway-service:
    image: videnti-app:latest
    command: ./gateway
    container_name: videnti_gateway
    restart: always
    network_mode: host
    depends_on:
      - auth-service
      - attendance-service
      - payroll-service
      - face-api-service
    volumes:
      - uploads_data:/app/uploads
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

  face-api-service:
    image: videnti-app:latest
    command: python -m uvicorn process_face_api:app --host 0.0.0.0 --port 5000
    container_name: videnti_face_api
    restart: always
    network_mode: host

volumes:
  postgres_data:
  uploads_data:
